# Tiny Tapeout project information
project:
  title:        "KarachiFlow"
  author:       "Rida Noor Qasmi"
  discord:      ""
  description:  "Adaptive two-road traffic controller with demand-based timing and emergency priority"
  language:     "Verilog"
  clock_hz:     0

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Tiny Tapeout top-level wrapper
  top_module:  "tt_um_karachiflow"

  # Source files located in ./src
  source_files:
    - "karachiflow.v"
    - "tt_um_karachiflow.v"

# The pinout of your project.
# Leave unused pins blank. DO NOT delete or add any pins.
pinout:

  # Inputs
  ui[0]: "traffic_a[0]"
  ui[1]: "traffic_a[1]"
  ui[2]: "traffic_b[0]"
  ui[3]: "traffic_b[1]"
  ui[4]: "emergency_a"
  ui[5]: "emergency_b"
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "a_red"
  uo[1]: "a_yellow"
  uo[2]: "a_green"
  uo[3]: "b_red"
  uo[4]: "b_yellow"
  uo[5]: "b_green"
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins - unused
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6